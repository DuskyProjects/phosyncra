[workspace]
resolver = "2"
members = [
    "crates/phosyncra-core",
    "crates/phosyncra-daemon",
    "crates/phosyncra-spotify",
    "crates/phosyncra-cli",
    "crates/phosyncra-analysis",
    "crates/phosyncra-musicbrainz",
    "crates/phosyncra-acousticbrainz",
    "crates/phosyncra-matter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["DuskyProjects"]
repository = "https://github.com/DuskyProjects/phosyncra"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "process", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
